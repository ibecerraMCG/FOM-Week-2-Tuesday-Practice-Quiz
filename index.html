<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Tuesday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 2 Tuesday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

    <script>
        const quizData = [
            // Pharmacodynamics Questions
            {
                learningObjective: "LO1 (Pharmacodynamics): List the major categories of small molecule drug targets.",
                question: "A pharmaceutical company is developing a new small molecule drug to treat hypertension. Based on the most common targets for small molecule therapeutics, which of the following cellular components is the most likely target for this new drug?",
                options: { A: "Ribosomal RNA", B: "G protein-coupled receptors (GPCRs)", C: "Mitochondrial DNA", D: "Extracellular matrix proteins", E: "Microtubules" },
                correctAnswer: "B",
                rationale: "G protein-coupled receptors (GPCRs) are one of the largest and most diverse families of cell surface receptors and represent the most common target for small molecule drugs. Many existing antihypertensive medications, such as beta-blockers and angiotensin II receptor blockers, target GPCRs involved in regulating blood pressure.",
                source: "Source (Pharmacodynamics, Slide 4): The slide 'Small molecule drug targets' lists 'G protein-coupled receptors (7TM)' as the first and a major category of targets."
            },
            {
                learningObjective: "LO1 (Pharmacodynamics): List the major categories of small molecule drug targets.",
                question: "A new drug with the suffix '-tinib' is approved for the treatment of a specific type of lung cancer. Based on established drug nomenclature, this small molecule drug most likely targets which of the following?",
                options: { A: "A G protein-coupled receptor", B: "An ion channel", C: "A receptor tyrosine kinase (rtk)", D: "A nuclear receptor", E: "A structural protein" },
                correctAnswer: "C",
                rationale: "The suffix '-tinib' is the established stem for tyrosine kinase inhibitors. Receptor tyrosine kinases (rtks) are a major class of enzymes that are frequently targeted in cancer therapy. Other targets like GPCRs, ion channels, and nuclear receptors do not follow this nomenclature.",
                source: "Source (Pharmacodynamics, Slide 11): The slide 'Suffixes: from -abine to -zotan' explicitly lists '-tinib; rtk inhibitor'."
            },
            {
                learningObjective: "LO1 (Pharmacodynamics): List the major categories of small molecule drug targets.",
                question: "A patient with hypercholesterolemia is prescribed atorvastatin. This drug lowers cholesterol levels by inhibiting HMG-CoA reductase, a key component in the cholesterol biosynthesis pathway. HMG-CoA reductase belongs to which major category of drug targets?",
                options: { A: "Transport proteins", B: "Ligand-gated ion channels", C: "Nuclear receptors", D: "Enzymes", E: "G protein-coupled receptors" },
                correctAnswer: "D",
                rationale: "Atorvastatin is an inhibitor of a specific enzyme, HMG-CoA reductase. Enzymes are a primary category of targets for small molecule drugs, where the drug typically binds to the active site to block the enzyme's catalytic function.",
                source: "Source (Pharmacodynamics, Slide 4): The slide 'Small molecule drug targets' lists 'Enzymes (kinases)' as a major category of drug targets."
            },
            {
                learningObjective: "LO2 (Pharmacodynamics): Distinguish between orthosteric and allosteric ligands and the different types of ligands within each class.",
                question: "A patient with anxiety is prescribed a benzodiazepine. This drug does not activate the GABAA receptor on its own but binds to a site on the receptor distinct from the GABA binding site, enhancing the effect of GABA when it binds. This benzodiazepine is best classified as which of the following?",
                options: { A: "A competitive antagonist", B: "An orthosteric agonist", C: "A positive allosteric modulator (PAM)", D: "An inverse agonist", E: "A neutral antagonist" },
                correctAnswer: "C",
                rationale: "The drug binds to an allosteric site (a site other than the primary ligand binding site) and enhances the action of the endogenous agonist (GABA). This defines it as a positive allosteric modulator (PAM). It is not an orthosteric agonist because it doesn't bind the main site, and it is not an antagonist because it doesn't block the effect.",
                source: "Source (Pharmacodynamics, Slide 27): This slide defines 'Negative (NAM) and positive (PAM) allosteric modulators' and shows that allosteric ligands bind to a site distinct from the orthosteric site to modulate receptor activity."
            },
            {
                learningObjective: "LO2 (Pharmacodynamics): Distinguish between orthosteric and allosteric ligands and the different types of ligands within each class.",
                question: "A new drug is developed that binds to the same site on the beta-adrenergic receptor as epinephrine. However, upon binding, it shifts the receptor equilibrium toward the inactive (R) conformation, reducing the basal level of signaling. This drug is best described as:",
                options: { A: "A partial agonist", B: "A competitive antagonist", C: "An inverse agonist", D: "A negative allosteric modulator (NAM)", E: "A full agonist" },
                correctAnswer: "C",
                rationale: "An inverse agonist binds to the orthosteric site and stabilizes the inactive conformation of the receptor (R), thereby reducing any constitutive or basal activity. This is distinct from a competitive (neutral) antagonist, which binds the site but does not shift the equilibrium in either direction.",
                source: "Source (Pharmacodynamics, Slide 19): 'Inverse agonists shift equilibrium towards the inactive conformation. Effect obvious if much constitutive activity.' Slide 20 graphically illustrates this as reducing activity below the basal level."
            },
            {
                learningObjective: "LO2 (Pharmacodynamics): Distinguish between orthosteric and allosteric ligands and the different types of ligands within each class.",
                question: "Pindolol is a beta-blocker that, in the absence of an agonist like epinephrine, causes a small increase in heart rate. However, in the presence of high levels of epinephrine, it blocks the much larger increase in heart rate caused by epinephrine. Based on this description, pindolol is best classified as a:",
                options: { A: "Full agonist", B: "Partial agonist", C: "Inverse agonist", D: "Positive allosteric modulator (PAM)", E: "Neutral antagonist" },
                correctAnswer: "B",
                rationale: "Partial agonists have intrinsic activity but lower efficacy than full agonists. In the absence of a full agonist, they produce a submaximal response. In the presence of a full agonist, they compete for the same receptor site and can act as antagonists by preventing the full agonist from binding and eliciting a maximal response.",
                source: "Source (Pharmacodynamics, Slide 17): 'Partial agonists shift R-R* equilibrium partially towards the active conformation.' The graph shows a partial agonist producing a response that is above baseline but below that of a full agonist."
            },
             {
                learningObjective: "LO3 (Pharmacodynamics): Explain the concept of therapeutic index.",
                question: "A new chemotherapy agent is being evaluated. In clinical trials, the dose required to produce a therapeutic effect in 50% of patients (ED50) is 5 mg/kg. The dose that produces a toxic effect in 50% of patients (TD50) is 100 mg/kg. What is the therapeutic index (TI) for this drug?",
                options: { A: "0.05", B: "5", C: "20", D: "95", E: "500" },
                correctAnswer: "C",
                rationale: "The therapeutic index (TI) is a measure of a drug's safety, calculated as the ratio of the toxic dose to the therapeutic dose. A higher TI indicates a wider margin of safety. The formula is TI = TD50 / ED50.",
                source: "Source (Pharmacodynamics, Slide 31): The slide clearly states the formula: 'Therapeutic Index = TD50/ED50'. Applying the values from the question: TI = 100 mg/kg / 5 mg/kg = 20."
            },
            {
                learningObjective: "LO3 (Pharmacodynamics): Explain the concept of therapeutic index.",
                question: "Drug A has a therapeutic index of 2, while Drug B has a therapeutic index of 15. Both drugs are used to treat the same condition. Which of the following statements is the most accurate interpretation of this information?",
                options: { A: "Drug A is more potent than Drug B.", B: "Drug B has a wider margin of safety than Drug A.", C: "Drug A has a higher efficacy than Drug B.", D: "Drug B must be administered at a higher dose than Drug A.", E: "Drug A is safer for long-term use than Drug B." },
                correctAnswer: "B",
                rationale: "The therapeutic index (TI) is a quantitative measure of drug safety. A larger TI indicates that a much higher dose is needed to produce a toxic effect compared to the dose needed for a therapeutic effect. Therefore, Drug B, with a TI of 15, has a significantly wider and safer therapeutic window than Drug A, which has a narrow TI of 2.",
                source: "Source (Pharmacodynamics, Slide 31): The concept is illustrated by the separation between the therapeutic and toxic dose-response curves. A larger separation (higher TI) implies greater safety."
            },
            {
                learningObjective: "LO3 (Pharmacodynamics): Explain the concept of therapeutic index.",
                question: "A patient is taking Drug A, which has a target plasma concentration of 3 ng/mL and a toxic concentration greater than 60 ng/mL. What is the approximate therapeutic index (TI) for Drug A, assuming the target concentration is near the ED50?",
                options: { A: ">2", B: ">10", C: ">20", D: ">60", E: ">180" },
                correctAnswer: "C",
                rationale: "The therapeutic index is the ratio of the toxic dose to the effective dose (TI = TD50/ED50). Using the given concentrations as surrogates for dose, the TI can be approximated. Assuming the target concentration (3 ng/mL) is the ED50 and the toxic concentration (>60 ng/mL) is the TD50, the calculation is TI > 60 ng/mL / 3 ng/mL.",
                source: "Source (Pharmacodynamics, Page 34, Question 5): 'TI=TD50/ED50. These values aren't given per se, but assuming [target] is above ED50, then the TI is >60ng ml⁻¹/3ng ml⁻¹, or >20.'"
            },
            {
                learningObjective: "LO4 (Pharmacodynamics): Discuss the implications of pharmacodynamic genetic polymorphisms.",
                question: "A patient with metastatic colorectal cancer has a mutation in the KRAS gene. This mutation results in a constitutively active KRAS protein, which is a key downstream component of the EGFR signaling pathway. How would this patient likely respond to treatment with cetuximab, a monoclonal antibody that blocks the epidermal growth factor receptor (EGFR)?",
                options: { A: "The patient will have a significantly better survival outcome compared to supportive care alone.", B: "The patient will have a similar survival outcome to supportive care alone.", C: "The patient will experience a rapid and complete remission.", D: "The patient will develop severe hypersensitivity to the drug.", E: "The drug will be metabolized more quickly in this patient." },
                correctAnswer: "B",
                rationale: "Cetuximab works by blocking the EGFR, which is upstream of KRAS. If KRAS is mutated and constitutively active, the signaling pathway is turned on 'downstream' of the receptor. Therefore, blocking the receptor with cetuximab will have no effect on the uncontrolled proliferation driven by the mutant KRAS. The drug will be ineffective.",
                source: "Source (Pharmacodynamics, Slide 30): This slide shows two survival curves. The top graph for 'Wild-type K-ras' shows a significant survival benefit with Cetuximab (P<0.001). The bottom graph for 'Mutated K-ras' shows no significant difference in survival between cetuximab and supportive care alone (P=0.89), demonstrating the ineffectiveness of the drug in the presence of this pharmacodynamic polymorphism."
            },
            {
                learningObjective: "LO4 (Pharmacodynamics): Discuss the implications of pharmacodynamic genetic polymorphisms.",
                question: "Certain polymorphisms in the human Beta-1 Adrenergic Receptor are known to affect patient response to beta-blockers. For example, a polymorphism at position 389 can result in either an Arginine or a Glycine residue. This type of genetic variation, which affects the drug's target, is an example of:",
                options: { A: "Pharmacokinetic variability", B: "Receptor desensitization", C: "Pharmacodynamic polymorphism", D: "Allosteric modulation", E: "Receptor downregulation" },
                correctAnswer: "C",
                rationale: "Pharmacodynamic polymorphisms are variations in genes that code for drug targets, such as receptors or enzymes. These variations can alter the affinity or efficacy of a drug, leading to different responses among individuals. This is distinct from pharmacokinetic variability, which involves differences in drug absorption, distribution, metabolism, or excretion.",
                source: "Source (Pharmacodynamics, Slide 29): The slide is titled 'Pharmacodynamic variability' and lists 'Pharmacodynamic polymorphisms (SNPs)' as a key point, showing the Beta-1 Adrenergic Receptor as a specific example."
            },
            {
                learningObjective: "LO4 (Pharmacodynamics): Discuss the implications of pharmacodynamic genetic polymorphisms.",
                question: "The field of pharmacogenomics aims to tailor drug therapy based on an individual's genetic makeup. A patient's response to a drug can be significantly altered by a single nucleotide polymorphism (SNP) in the gene encoding the drug's receptor. This alteration in drug response is a direct consequence of a change in which of the following?",
                options: { A: "The rate of drug elimination", B: "The process of drug absorption", C: "The drug's interaction with its target", D: "The plasma protein binding of the drug", E: "The first-pass metabolism of the drug" },
                correctAnswer: "C",
                rationale: "Pharmacodynamic polymorphisms, such as SNPs in a receptor gene, directly affect the structure and function of the drug's target. This can change how the drug binds to the target (affinity) or the response that is generated after binding (efficacy), thereby altering the drug's effect at the cellular level.",
                source: "Source (Pharmacodynamics, Slide 29): The slide title 'Pharmacodynamic variability' and the example of polymorphisms in a receptor gene directly link genetic variations to the drug target's function."
            },
            // Membrane Transport Questions
            {
                learningObjective: "LO1 (Membrane Transport): Describe the role and significance of sodium-coupled glucose transporters in the uptake/reuptake of glucose in the intestine and kidney.",
                question: "A newborn infant presents with severe, watery diarrhea and dehydration shortly after beginning breastfeeding. The infant is diagnosed with glucose-galactose malabsorption, a genetic disorder caused by a defect in the SGLT1 transporter. This transporter is crucial for which of the following processes?",

                correctAnswer: "D",
                rationale: "SGLT1 is a secondary active transporter located on the apical membrane of intestinal mucosal cells. It is responsible for absorbing glucose and galactose from the diet by coupling their transport to the influx of sodium down its concentration gradient. A defect in SGLT1 prevents this initial absorption step.",

            },
            {
                learningObjective: "LO1 (Membrane Transport): Describe the role and significance of sodium-coupled glucose transporters...",
                question: "A patient with type 2 diabetes is prescribed canagliflozin, an SGLT2 inhibitor. This drug lowers blood glucose levels by promoting glycosuria. The therapeutic action of this drug is primarily due to the inhibition of glucose reabsorption in which of the following locations?",
                options: { A: "Apical membrane of intestinal mucosal cells", B: "Basolateral membrane of hepatocytes", C: "Apical membrane of renal proximal tubular cells", D: "Plasma membrane of adipocytes", E: "Basolateral membrane of intestinal mucosal cells" },
                correctAnswer: "C",
                rationale: "SGLT2 is the major transporter responsible for reabsorbing glucose from the glomerular filtrate back into the blood. It is located on the apical (luminal) membrane of the proximal convoluted tubules in the kidney. Inhibiting SGLT2 blocks this reabsorption, causing excess glucose to be excreted in the urine.",
                source: "Source (Membrane Transport, Page 6): The diagram is titled 'Role of SGLT2 in Renal Glucose Reabsorption' and shows SGLT2 on the 'Kidney tubular lumen' side. The text notes that SGLT2 inhibitors like Jardiance, Farxiga, and Invokana are used for 'Type 2 diabetes Treatment'."
            },
            {
                learningObjective: "LO1 (Membrane Transport): Describe the role and significance of sodium-coupled glucose transporters...",
                question: "The energy for glucose transport via both SGLT1 and SGLT2 is ultimately derived from the hydrolysis of ATP. This energy is used directly by which of the following membrane proteins to establish the gradient necessary for SGLT function?",

                correctAnswer: "C",
                rationale: "SGLT1 and SGLT2 are secondary active transporters that use the electrochemical Na+ gradient as their energy source. This gradient (low intracellular Na+) is established and maintained by the Na+/K+ pump (Na+/K+-ATPase), which is a primary active transporter that directly hydrolyzes ATP to pump Na+ out of the cell.",
                source: "Source (Membrane Transport, Page 5): 'Ultimately, the energy for the transport process comes from ATP, which drives the Na+-K+ pump which in turn generates and maintains the sodium gradient across the brush border membrane.'"
            },
            {
                learningObjective: "LO2 (Membrane Transport): Explain the function, tissue-specific expression, and significance of facilitative glucose transporters...",
                question: "A patient with type 1 diabetes mellitus injects insulin before a meal. The insulin binds to its receptors on skeletal muscle cells and adipocytes, leading to the translocation of a specific glucose transporter from intracellular vesicles to the plasma membrane. This action facilitates glucose uptake from the blood into these tissues. Which transporter is being regulated by insulin?",

                correctAnswer: "D",
                rationale: "GLUT4 is the primary insulin-sensitive glucose transporter. In the absence of insulin, GLUT4 is stored in intracellular vesicles. Insulin signaling triggers the fusion of these vesicles with the plasma membrane, increasing the number of GLUT4 transporters on the cell surface and thereby increasing glucose uptake into striated muscle and adipose tissue.",

            },
            {

                rationale: "GLUT2 has a high Km (low affinity) for glucose, meaning it only transports glucose efficiently when blood glucose concentrations are high, such as after a meal. This property, combined with its high capacity, makes it an ideal 'glucose sensor' and transporter for the liver and pancreatic β-cells, allowing them to respond appropriately to hyperglycemia.",
                source: "Source (Membrane Transport, Page 7, Table): The table lists GLUT2 as having a low affinity (Km 15-20 mM) and being expressed in the 'Liver, β cells of pancreas, kidney, small intestine', with a proposed function as a 'High-capacity, low affinity transport, glucose sensor'."
            },
            {

                question: "Fructose is a monosaccharide found in fruits and honey. Its absorption from the small intestine into enterocytes occurs via facilitated diffusion through a specific transporter on the apical membrane. Which facilitative glucose transporter is primarily responsible for fructose uptake?",
                options: { A: "GLUT1", B: "GLUT2", C: "GLUT4", D: "GLUT5", E: "SGLT1" },
                correctAnswer: "D",
                rationale: "GLUT5 is the specific transporter for fructose. It mediates the facilitated diffusion of fructose across the apical membrane of intestinal mucosal cells. Genetic defects in GLUT5 can lead to fructose malabsorption.",
                source: "Source (Membrane Transport, Page 14): 'GLUT5 is a specific transporter for fructose. It mediates the facilitated diffusion of fructose into the mucosal cells.' and Page 7 table notes GLUT5's proposed function is 'Fructose uptake'."
            },
            {
                learningObjective: "LO3 (Membrane Transport): Describe the common biochemical and clinical features of GLUT-1... deficiency and the utility of GLUT1 in metabolic imaging of cancer...",
                question: "A 6-month-old infant presents with intractable seizures, developmental delay, and acquired microcephaly. Analysis of the cerebrospinal fluid (CSF) reveals a low glucose level (hypoglycorrhachia) despite a normal blood glucose level. A diagnosis of GLUT1 deficiency syndrome is made. The underlying pathology is due to impaired transport of glucose across which of the following barriers?",

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;
                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
